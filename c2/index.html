<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#173e33">
<meta name="description" content="Página de teste para ouvir uma gravação diretamente no site.">
<title>Teste de áudio</title>
<style>
:root{color-scheme:light;--cream:#f7f2e8;--green:#173e33;--muted:#58665f;--mustard:#e4b348;--terra:#b75a3d}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;background:var(--cream);color:var(--green);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
main{min-height:100svh;display:grid;place-items:center;padding:40px 22px}
.page{width:min(100%,690px)}
.eyebrow{display:flex;align-items:center;gap:10px;font-size:.75rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin:0 0 20px}
.eyebrow::before{content:"";flex:0 0 25px;height:3px;background:var(--terra)}
h1{margin:0 0 14px;max-width:12ch;font-size:clamp(2.6rem,7vw,4.2rem);letter-spacing:-.055em;line-height:1.05;font-weight:750}
.intro{margin:0 0 32px;max-width:45ch;color:var(--muted);font-size:1.06rem;line-height:1.65}
.player{position:relative;overflow:hidden;background:var(--green);color:var(--cream);border-radius:25px;padding:32px;box-shadow:0 18px 50px #173e3312}
.player::after{content:"";position:absolute;width:150px;height:150px;top:-91px;right:-20px;border:26px solid #ffffff08;border-radius:50%;pointer-events:none}
.track{display:flex;align-items:center;gap:18px;margin-bottom:28px}
.icon{flex:0 0 60px;height:60px;display:grid;place-items:center;background:var(--mustard);color:var(--green);border-radius:17px}
.icon svg{width:30px;height:30px}
.track-text{min-width:0}
h2{margin:0 0 5px;font-size:1.25rem;font-weight:650;line-height:1.3}
.track-text p{margin:0;font-size:.87rem;color:#d1dfd6}
audio{display:block;width:100%;height:54px;border-radius:28px}
.status{margin:17px 0 0;display:flex;align-items:center;gap:8px;font-size:.85rem;line-height:1.5;color:#d1dfd6}
.dot{display:inline-block;flex:0 0 6px;height:6px;border-radius:50%;background:var(--mustard)}
.hint{margin:22px 0 0;font-size:.85rem;color:var(--muted);line-height:1.6}
a{color:inherit;text-underline-offset:3px}
a:focus-visible,audio:focus-visible{outline:3px solid var(--mustard);outline-offset:5px}
@media(max-width:420px){main{padding:30px 18px}.player{padding:24px 18px;border-radius:21px}.track{gap:13px}.icon{flex-basis:52px;height:52px}}
</style>
</head>
<body>
<main><div class="page">
<p class="eyebrow">Pequenas Escutas, Grandes Reflexões</p>
<h1>Uma pausa para ouvir.</h1>
<p class="intro">Aperte o play para ouvir a gravação aqui mesmo. Você pode pausar e voltar ao ponto que quiser.</p>
<section class="player" aria-labelledby="track-title">
<div class="track">
<span class="icon" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 18v-3a11 11 0 0 1 22 0v3"/><rect x="3" y="16" width="6" height="11" rx="3"/><rect x="23" y="16" width="6" height="11" rx="3"/></svg></span>
<div class="track-text"><h2 id="track-title">Gravação de teste</h2><p id="track-meta">Áudio</p></div>
</div>
<audio id="audio" controls preload="metadata" aria-label="Ouvir gravação de teste" src="aa.m4a">Seu navegador não oferece reprodução de áudio.</audio>
<p class="status" aria-live="polite"><span class="dot" aria-hidden="true"></span><span id="status">Carregando gravação…</span></p>
</section>
<p class="hint">O áudio começa somente quando você aperta o play.</p>
</div></main>
<script>
const audio=document.getElementById('audio');
const statusText=document.getElementById('status');
const metadata=document.getElementById('track-meta');
function formatTime(seconds){
 if(!Number.isFinite(seconds))return '';
 const total=Math.floor(seconds);
 return Math.floor(total/60)+':'+String(total%60).padStart(2,'0');
}
function ready(){
 const duration=formatTime(audio.duration);
 metadata.textContent=duration?'Áudio · '+duration:'Áudio';
 if(audio.paused&&audio.currentTime===0)statusText.textContent='Pronto para ouvir';
}
audio.addEventListener('loadedmetadata',ready);
audio.addEventListener('canplay',ready);
audio.addEventListener('play',()=>{statusText.textContent='Reproduzindo'});
audio.addEventListener('pause',()=>{if(!audio.ended)statusText.textContent='Pausado'});
audio.addEventListener('ended',()=>{statusText.textContent='Reprodução concluída'});
audio.addEventListener('error',()=>{
 statusText.replaceChildren(document.createTextNode('Não foi possível reproduzir. '));
 const link=document.createElement('a');
 link.href=audio.currentSrc||audio.src;
 link.download='aa.m4a';
 link.textContent='Baixar gravação';
 statusText.append(link);
});
if(audio.readyState>=1)ready();
</script>
</body>
</html>
